quarkus.application.name=fiq
quarkus.http.port=${FIQ_HTTP_PORT:9091}
quarkus.http.root-path=/
quarkus.http.non-application-root-path=/q
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FIQ_CORS_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,X-FIQ-Workspace,X-API-Key,Idempotency-Key

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${FIQ_DATABASE_URL:jdbc:postgresql://localhost:5432/fiq}
quarkus.datasource.username=${FIQ_DATABASE_USER:fiq}
quarkus.datasource.password=${FIQ_DATABASE_PASSWORD:fiq}
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=20

quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-on-migrate=true
quarkus.flyway.clean-disabled=true

quarkus.oidc.enabled=${FIQ_OIDC_ENABLED:false}
quarkus.oidc.auth-server-url=${FIQ_OIDC_URL:http://localhost:8180/realms/fiq}
quarkus.oidc.client-id=${FIQ_OIDC_CLIENT_ID:fiq}
quarkus.oidc.credentials.secret=${FIQ_OIDC_CLIENT_SECRET:disabled}
quarkus.oidc.application-type=web-app
quarkus.oidc.authentication.pkce-required=true
quarkus.oidc.authentication.cookie-same-site=strict
quarkus.oidc.authentication.cookie-force-secure=${FIQ_COOKIE_SECURE:true}

fiq.auth.enabled=${FIQ_AUTH_ENABLED:true}
fiq.default-workspace-id=${FIQ_DEFAULT_WORKSPACE_ID:00000000-0000-0000-0000-000000000001}
fiq.scheduler.enabled=${FIQ_SCHEDULER_ENABLED:true}
fiq.scheduler.batch-size=${FIQ_SCHEDULER_BATCH_SIZE:20}
fiq.scheduler.lease-seconds=${FIQ_SCHEDULER_LEASE_SECONDS:300}
fiq.livy.url=${FIQ_LIVY_URL:http://localhost:8998}
fiq.sample.enabled=${FIQ_SAMPLE_ENABLED:false}
fiq.s3.endpoint=${FIQ_S3_ENDPOINT:}
fiq.livy.job-jar=${FIQ_LIVY_JOB_JAR:local:///opt/fiq/fiq-spark-job.jar}
fiq.livy.main-class=io.fiq.spark.MaintenanceJob

quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.micrometer.export.prometheus.path=/metrics

%dev.fiq.auth.enabled=false
%dev.quarkus.oidc.enabled=false
%dev.quarkus.oidc.authentication.cookie-force-secure=false
%test.fiq.auth.enabled=false
%test.quarkus.oidc.enabled=false
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.datasource.devservices.enabled=false
