spark.master                         local[2]
spark.driver.memory                  1g
spark.executor.memory                1g
spark.sql.shuffle.partitions         8
spark.sql.extensions                 io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog      org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.sql.catalogImplementation      hive
spark.sql.warehouse.dir              s3a://fiq-samples/hms/warehouse
spark.sql.hive.metastore.version     4.0.1
spark.sql.hive.metastore.jars        maven
spark.hadoop.hive.metastore.uris     thrift://hms:9083
# Spark 4.0.1's official hadoop3 binary embeds Hadoop client 3.4.1; S3A must match it exactly.
spark.jars.packages                  io.delta:delta-spark_2.13:4.0.1,org.apache.hadoop:hadoop-aws:3.4.1
spark.hadoop.fs.s3a.endpoint         http://minio:9000
spark.hadoop.fs.s3a.path.style.access true
spark.hadoop.fs.s3a.connection.ssl.enabled false
# Delta's production default fans VACUUM deletion across 10,000 tasks. Keep the isolated local
# sample stack bounded while preserving the same Delta VACUUM API and safety behavior.
spark.databricks.delta.vacuum.parallelDelete.parallelism 8
