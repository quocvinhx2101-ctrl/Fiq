name: fiq

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: fiq
      POSTGRES_USER: fiq
      POSTGRES_PASSWORD: fiq
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiq -d fiq"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["fiq-postgres:/var/lib/postgresql/data"]

  server:
    image: fiq-server:local
    build: .
    environment:
      FIQ_DATABASE_URL: jdbc:postgresql://postgres:5432/fiq
      FIQ_DATABASE_USER: fiq
      FIQ_DATABASE_PASSWORD: fiq
      FIQ_AUTH_ENABLED: "false"
      FIQ_OIDC_ENABLED: "false"
      FIQ_COOKIE_SECURE: "false"
      FIQ_SAMPLE_ENABLED: "false"
      # Optional pass-through for an existing S3-compatible platform. When the host variables
      # are unset, Compose omits them and FIQ still starts in an empty/configurable state.
      FIQ_S3_ENDPOINT:
      FIQ_RESULTS_PREFIX:
      FIQ_LIVY_JOB_JAR:
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:
      AWS_SESSION_TOKEN:
    ports: ["9091:9091"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  fiq-postgres:
