replicaCount: 2
image:
  repository: ghcr.io/example/fiq
  tag: "0.1.0"
  pullPolicy: IfNotPresent
service:
  port: 9091
resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { cpu: "2", memory: 2Gi }
config:
  databaseUrl: jdbc:postgresql://postgresql.data.svc:5432/fiq
  databaseUser: fiq
  livyUrl: http://livy.spark.svc:8998
  oidcUrl: https://identity.example/realms/data
  oidcClientId: fiq
  defaultWorkspaceId: 00000000-0000-0000-0000-000000000001
secrets:
  existingSecret: fiq-runtime
ingress:
  enabled: false
  className: nginx
  host: fiq.example.com
